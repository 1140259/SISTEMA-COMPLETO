<div class="container-fluid bg-primary p-2 mb-3">

  <div class="d-flex justify-content-end">

    <a
      routerLink="/inicio"
      class="btn btn-light me-2">

      🏠 Inicio

    </a>

    <a
      routerLink="/reportes"
      class="btn btn-warning me-2">

      📊 Reportes

    </a>

    <a
      routerLink="/"
      class="btn btn-danger">

      🚪 Salir

    </a>

  </div>

</div>
<div class="container-fluid mt-4">

  <div class="card shadow">

    <div class="card-header bg-primary text-white">
      <h3>Especialidades Médicas</h3>
    </div>

    <div class="card-body">

      <div class="row">

        <div class="col-md-8">

          <label>Especialidad</label>

          <input
            class="form-control"
            [(ngModel)]="especialidad.ESPECIALIDAD">

        </div>

        <div class="col-md-4">

          <label>Estado</label>

          <select
            class="form-control"
            [(ngModel)]="especialidad.ESTADO">

            <option value="ACTIVO">ACTIVO</option>

            <option value="INACTIVO">INACTIVO</option>

          </select>

        </div>

      </div>

      <br>

      <button
        class="btn btn-secondary me-2"
        (click)="limpiarFormulario()">

        Nuevo

      </button>

      <button
        class="btn btn-success"
        (click)="guardarEspecialidad()">

        {{ especialidad.ID_ESPECIALIDAD ? 'Actualizar' : 'Guardar' }}

      </button>

    </div>

  </div>

  <div class="card shadow mt-4">

    <div class="card-header bg-dark text-white">

      <h4>Listado de Especialidades</h4>

    </div>

    <div class="card-body">

      <input
        class="form-control mb-3"
        placeholder="Buscar especialidad..."
        [(ngModel)]="filtro">

      <table class="table table-bordered table-striped">

        <thead class="table-primary">

          <tr>

            <th>ID</th>

            <th>Especialidad</th>

            <th>Estado</th>

            <th>Acciones</th>

          </tr>

        </thead>

        <tbody>

          <tr *ngFor="let item of especialidadesFiltradas">

            <td>{{ item.ID_ESPECIALIDAD }}</td>

            <td>{{ item.ESPECIALIDAD }}</td>

            <td>{{ item.ESTADO }}</td>

            <td>

              <button
                class="btn btn-warning btn-sm me-1"
                (click)="editarEspecialidad(item)">

                Editar

              </button>

              <button
                class="btn btn-danger btn-sm"
                (click)="eliminarEspecialidad(item.ID_ESPECIALIDAD)">

                Eliminar

              </button>

            </td>

          </tr>

          <tr *ngIf="especialidadesFiltradas.length === 0">

            <td
              colspan="4"
              class="text-center text-muted">

              No hay especialidades registradas

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
