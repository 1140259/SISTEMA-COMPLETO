<div class="login-container">

  <div class="login-card">

    <h1>CLINICA MEDICA USAP</h1>

    <h3>Sistema de Atención Médica</h3>

    <hr>

    <label>Usuario</label>

    <input
      type="text"
      class="form-control"
      [(ngModel)]="usuario">

    <br>

    <label>Contraseña</label>

    <input
      type="password"
      class="form-control"
      [(ngModel)]="password">

    <br>

    <div
      *ngIf="mensaje"
      class="alert alert-danger">

      {{ mensaje }}
    </div>

    <button
      class="btn btn-primary w-100"
      [disabled]="cargando"
      (click)="ingresar()">

      Ingresar

    </button>

  </div>

</div>
